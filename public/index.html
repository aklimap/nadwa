<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nadwa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ============ Connexion ============ -->
  <main id="ecran-auth" class="auth" hidden>
    <section class="auth-marque">
      <div class="marque"><span class="logo-nom" data-logo></span></div>
      <div class="auth-accroche">
        <h1 data-i18n="accroche"></h1>
        <p data-i18n="slogan"></p>
      </div>
      <div class="auth-puces">
        <span data-i18n="conversation"></span>
        <span data-i18n="equipes"></span>
        <span data-i18n="reunions_video"></span>
        <span data-i18n="agenda"></span>
      </div>
    </section>
    <section class="auth-panneau">
      <div class="auth-haut">
        <label class="langue-libelle"><span data-i18n="langue"></span><select class="choix-langue"></select></label>
      </div>
      <div class="auth-formulaire">
        <div>
          <h2 id="auth-titre"></h2>
          <p class="auth-sous-titre" id="auth-sous-titre"></p>
        </div>
        <form id="form-auth" novalidate>
          <label data-inscription hidden><span data-i18n="nom_complet"></span><input name="nom" autocomplete="name"></label>
          <label><span data-i18n="email"></span><input name="email" type="email" required autocomplete="email" dir="ltr" placeholder="nom@exemple.com"></label>
          <label><span data-i18n="mot_de_passe"></span><input name="mot_de_passe" type="password" required minlength="8" autocomplete="current-password"></label>
          <button type="button" class="btn-lien lien-oubli" id="btn-oubli" data-i18n="mdp_oublie"></button>
          <p class="erreur" id="auth-erreur" role="alert"></p>
          <button class="btn btn-accent btn-grand" type="submit" id="auth-soumettre"></button>
        </form>
        <p class="auth-bascule"><span id="auth-bascule-texte"></span> <button type="button" class="btn-lien" id="auth-bascule"></button></p>
        <div class="separateur"><span data-i18n="ou"></span></div>
        <button type="button" class="btn btn-contour btn-grand" id="btn-lien-reunion">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>
          <span data-i18n="rejoindre_avec_lien"></span>
        </button>
      </div>
    </section>
  </main>

  <!-- ============ Avant d'entrer dans une réunion (membres et invités) ============ -->
  <main id="ecran-reunion" class="avant-reunion" hidden>
    <header class="avant-haut">
      <span class="logo-nom marque-sombre" data-logo></span>
      <div class="avant-haut-droite">
        <select class="choix-langue" data-i18n-aria="langue"></select>
        <button class="btn-lien" id="avant-retour" data-i18n="retour"></button>
      </div>
    </header>
    <div class="avant-contenu" id="avant-contenu"></div>
  </main>

  <!-- ============ Visio dans la page (comme Teams) ============ -->
  <div id="ecran-visio" class="visio" hidden>
    <header class="visio-barre">
      <strong class="visio-titre" id="visio-titre"></strong>
      <div class="visio-actions">
        <button class="btn btn-danger" id="visio-terminer" data-i18n="terminer_pour_tous" hidden></button>
        <button class="btn btn-contour-clair" id="visio-quitter" data-i18n="quitter"></button>
      </div>
    </header>
    <div class="visio-cadre" id="visio-cadre"></div>
  </div>

  <!-- ============ Application ============ -->
  <div id="ecran-app" class="app" hidden>
    <nav class="rail" data-i18n-aria="nav_principale">
      <span class="rail-logo" data-logo aria-hidden="true"></span>
      <button class="rail-btn" data-vue="conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span data-i18n="conversation"></span>
        <b class="rail-badge" id="badge-conversation" hidden></b>
      </button>
      <button class="rail-btn" data-vue="classes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6.2 4.4 1.8 5 4.8"/></svg>
        <span data-i18n="equipes"></span>
      </button>
      <button class="rail-btn" data-vue="agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span data-i18n="agenda"></span>
      </button>
      <div class="rail-espace"></div>
      <button class="rail-moi" id="btn-moi" data-i18n-aria="mon_compte" aria-haspopup="true"></button>
    </nav>

    <!-- Conversation -->
    <section id="vue-conversation" class="vue vue-deux" hidden>
      <aside class="volet">
        <header class="volet-haut">
          <h1 data-i18n="conversation"></h1>
          <button class="btn-icone" id="btn-nouvelle-conv" data-i18n-aria="nouvelle_conversation" data-i18n-title="nouvelle_conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </header>
        <label class="recherche"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="recherche-conv" data-i18n-placeholder="rechercher_personne" data-i18n-aria="rechercher_personne"></label>
        <ul class="liste" id="liste-conversations"></ul>
      </aside>
      <article class="detail" id="detail-conversation"></article>
    </section>

    <!-- Équipes -->
    <section id="vue-classes" class="vue vue-deux" hidden>
      <aside class="volet">
        <header class="volet-haut">
          <div class="volet-titre">
            <button class="choix-org" id="btn-choix-org" hidden></button>
            <h1 data-i18n="equipes"></h1>
          </div>
          <button class="btn-icone" id="btn-nouvelle-classe" data-i18n-aria="creer_equipe" data-i18n-title="creer_equipe">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </header>
        <label class="recherche"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="recherche-equipe" data-i18n-placeholder="rechercher" data-i18n-aria="rechercher"></label>
        <ul class="liste" id="liste-classes"></ul>
        <div class="volet-bas">
          <button class="btn btn-contour btn-plein" data-ouvrir-code data-i18n="rejoindre_equipe_code"></button>
        </div>
      </aside>
      <article class="detail" id="classe"></article>
    </section>

    <!-- Calendrier -->
    <section id="vue-agenda" class="vue vue-cal" hidden>
      <div id="calendrier" class="calendrier"></div>
    </section>

    <!-- Gestion de l'organisation -->
    <section id="vue-gestion" class="vue vue-page" hidden>
      <header class="page-entete">
        <div>
          <h1 id="gestion-titre"></h1>
          <p data-i18n="gestion_intro"></p>
        </div>
        <button class="btn btn-accent" id="btn-ajouter-membre" data-i18n="ajouter_personnes"></button>
      </header>
      <div class="invitation" id="gestion-invitation"></div>
      <div class="stats" id="gestion-stats"></div>
      <div class="tableau" id="gestion-membres"></div>
    </section>

    <!-- Plateforme (exploitant) -->
    <section id="vue-plateforme" class="vue vue-page" hidden>
      <header class="page-entete">
        <div>
          <h1 data-i18n="plateforme"></h1>
          <p data-i18n="plateforme_intro"></p>
        </div>
      </header>
      <div class="stats" id="plateforme-stats"></div>
      <div class="tableau" id="plateforme-espaces"></div>
    </section>
  </div>

  <!-- ============ Menus ============ -->
  <div class="menu" id="menu-moi" hidden></div>
  <div class="menu" id="menu-equipe" hidden></div>
  <div class="menu" id="menu-reunion" hidden>
    <button type="button" data-menu-action="maintenant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/></svg>
      <span data-i18n="reunion_maintenant"></span>
    </button>
    <button type="button" data-menu-action="planifier">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span data-i18n="planifier_reunion"></span>
    </button>
  </div>

  <!-- ============ Dialogues ============ -->
  <dialog id="dlg-lien">
    <form>
      <h2 data-i18n="rejoindre_avec_lien"></h2>
      <label><span data-i18n="lien_ou_code"></span><input name="lien" required dir="ltr" placeholder="https://…/r/…"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="continuer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-oubli">
    <form>
      <h2 data-i18n="mdp_oublie"></h2>
      <p class="note" data-i18n="oubli_texte"></p>
      <label><span data-i18n="email"></span><input name="email" type="email" required dir="ltr" autocomplete="email"></label>
      <p class="message-info" id="oubli-envoye" hidden data-i18n="oubli_envoye"></p>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="fermer"></button>
        <button type="submit" class="btn btn-accent" data-i18n="envoyer_lien"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-reinit">
    <form>
      <h2 data-i18n="reinit_titre"></h2>
      <label><span data-i18n="nouveau_mdp_obl"></span><input name="mot_de_passe" type="password" required minlength="8" autocomplete="new-password"></label>
      <label><span data-i18n="confirmer_mdp"></span><input name="confirmation" type="password" required minlength="8" autocomplete="new-password"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="submit" class="btn btn-accent" data-i18n="enregistrer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-dossier">
    <form>
      <h2 data-i18n="nouveau_dossier"></h2>
      <label><span data-i18n="nom_dossier"></span><input name="nom" required maxlength="120"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="creer"></button>
      </div>
    </form>
  </dialog>

  <input type="file" id="choix-fichiers" multiple hidden>

  <dialog id="dlg-nouvelle-conv">
    <form>
      <h2 data-i18n="nouvelle_conversation"></h2>
      <fieldset class="participants">
        <legend data-i18n="avec_qui"></legend>
        <div class="choix-personnes" id="choix-conv"></div>
      </fieldset>
      <label id="champ-nom-groupe" hidden><span data-i18n="nom_groupe"></span><input name="nom" maxlength="80"></label>
      <p class="note" data-i18n="note_contacts"></p>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="commencer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-inviter">
    <div class="dlg-corps" id="inviter-corps"></div>
  </dialog>

  <dialog id="dlg-creer-espace">
    <form>
      <h2 data-i18n="creer_org"></h2>
      <p class="note" data-i18n="note_org"></p>
      <label><span data-i18n="nom_org"></span><input name="nom" required minlength="2" maxlength="100" data-i18n-placeholder="ex_org"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="btn_creer_org"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-code">
    <form>
      <h2 data-i18n="rejoindre_equipe_code"></h2>
      <label><span data-i18n="code_invitation"></span><input name="code" required maxlength="12" autocomplete="off" class="champ-code" placeholder="K7PM2Q"></label>
      <p class="note" data-i18n="note_code"></p>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="rejoindre"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-classe">
    <form>
      <h2 data-i18n="creer_equipe"></h2>
      <label><span data-i18n="nom_equipe"></span><input name="nom" required maxlength="100" data-i18n-placeholder="ex_equipe"></label>
      <label><span data-i18n="description"></span><input name="module" maxlength="100" data-i18n-placeholder="ex_description_equipe"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="creer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-canal">
    <form>
      <h2 data-i18n="ajouter_canal"></h2>
      <label><span data-i18n="nom_canal"></span><input name="nom" required maxlength="50" data-i18n-placeholder="ex_canal"></label>
      <label><span data-i18n="description"></span><input name="description" maxlength="120" data-i18n-placeholder="ex_description_canal"></label>
      <label class="case"><input type="checkbox" name="annonces"><span data-i18n="case_annonces"></span></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="ajouter"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-seance" class="dlg-large">
    <form>
      <h2 id="seance-titre-dlg" data-i18n="planifier_reunion"></h2>
      <label id="champ-equipe"><span data-i18n="equipe"></span><select name="classe_id"></select></label>
      <label><span data-i18n="titre"></span><input name="titre" required maxlength="120"></label>
      <div class="champs-ligne" id="champs-horaire">
        <label><span data-i18n="debut"></span><input name="debut" type="datetime-local" required></label>
        <label><span data-i18n="duree"></span>
          <select name="duree_min">
            <option value="30" data-i18n="d30"></option>
            <option value="45" data-i18n="d45"></option>
            <option value="60" data-i18n="d60"></option>
            <option value="90" selected data-i18n="d90"></option>
            <option value="120" data-i18n="d120"></option>
            <option value="180" data-i18n="d180"></option>
          </select>
        </label>
      </div>
      <fieldset class="participants" id="champ-participants">
        <legend data-i18n="participants"></legend>
        <p class="note" data-i18n="note_participants"></p>
        <div class="choix-personnes" id="choix-planif"></div>
      </fieldset>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" id="seance-valider" data-i18n="planifier"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-membre">
    <form>
      <h2 data-i18n="ajouter_personnes"></h2>
      <label><span data-i18n="email"></span><input name="email" type="email" required dir="ltr"></label>
      <p class="note" data-i18n="note_ajout_personne"></p>
      <label><span data-i18n="nom_complet"></span><input name="nom" maxlength="80"></label>
      <label><span data-i18n="mdp_provisoire"></span><input name="mot_de_passe" minlength="8" autocomplete="new-password"></label>
      <label><span data-i18n="role"></span>
        <select name="role">
          <option value="membre" data-i18n="role_membre"></option>
          <option value="admin" data-i18n="role_admin"></option>
        </select>
      </label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="ajouter"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-participants">
    <form>
      <h2 data-i18n="ajouter_participants"></h2>
      <p class="note" data-i18n="note_ajout_participants"></p>
      <div class="choix-personnes" id="choix-ajout"></div>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="ajouter"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-profil">
    <form>
      <h2 data-i18n="mon_profil"></h2>
      <label><span data-i18n="nom_complet"></span><input name="nom" required minlength="2" maxlength="80" autocomplete="name"></label>
      <p class="note" data-i18n="note_mdp_profil"></p>
      <label><span data-i18n="mdp_actuel"></span><input name="mot_de_passe_actuel" type="password" autocomplete="current-password"></label>
      <label><span data-i18n="nouveau_mdp"></span><input name="nouveau_mot_de_passe" type="password" minlength="8" autocomplete="new-password"></label>
      <p class="erreur" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-contour" data-fermer data-i18n="annuler"></button>
        <button type="submit" class="btn btn-accent" data-i18n="enregistrer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-reunion">
    <div class="dlg-corps"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
